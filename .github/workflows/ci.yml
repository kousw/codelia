name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  js:
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release): bump workspace to v') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Build core
        run: bun run --filter @codelia/core build
      - name: Typecheck
        run: bun run typecheck
      - name: Dependency hygiene
        run: |
          bun run check:deps
          bun run test:deps
      - name: Workspace version sync check
        run: bun run check:versions
      - name: Generated protocol files
        run: bun run check:protocol
      - name: Test
        run: bun run test:js
      - name: Terminal-Bench tests
        run: bun run test:terminal-bench

  tui:
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release): bump workspace to v') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/tui
            crates/protocol
      - name: Test shared protocol on minimum supported Rust
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          cargo +1.93.1 test --locked --manifest-path crates/protocol/Cargo.toml
      - name: Build
        run: cargo build --locked --manifest-path crates/tui/Cargo.toml
      - name: Test
        run: cargo test --locked --manifest-path crates/tui/Cargo.toml
      - name: Test light color scheme
        run: CODELIA_TUI_COLOR_SCHEME=light cargo test --locked --manifest-path crates/tui/Cargo.toml
      - name: Image preview PTY regression checks
        run: |
          python3 scripts/check-tui-image-preview_test.py
          python3 scripts/check-tui-image-preview.py crates/tui/target/debug/codelia-tui --read-size 113
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Native scrollback and verifier regression tests
        env:
          CODELIA_TUI_EMULATOR_DIR: ${{ runner.temp }}/codelia-tui-emulator
          CODELIA_TUI_CAPTURE_PATH: ${{ runner.temp }}/codelia-tui-capture.json
        run: |
          npm install --prefix "$CODELIA_TUI_EMULATOR_DIR" --ignore-scripts --no-audit --no-fund --package-lock=false @xterm/headless@6.0.0
          cargo test --locked --manifest-path crates/tui/Cargo.toml inline_native_scrollback_ansi_capture
          node --test scripts/check-tui-scrollback.test.mjs

  linux-sandbox:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Install pinned Linux sandbox runtime in the disposable runner
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gvisor.tar.zstd"
          curl --fail --show-error --silent --location --output "$archive" https://storage.googleapis.com/gvisor/releases/release/20261116.0/x86_64/gvisor.tar.zstd
          echo "4eb0475337f119ae7411c1d99d3acd727f1278a0286a244dee8dac91c6db5355  $archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/gvisor-runtime"
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/gvisor-runtime"
          sudo install -m 0755 -o root -g root "$RUNNER_TEMP/gvisor-runtime/runsc" /usr/bin/runsc
          sudo install -d -m 0755 /usr/bin/gvisor-bin
          sudo install -m 0755 -o root -g root "$RUNNER_TEMP"/gvisor-runtime/gvisor-bin/* /usr/bin/gvisor-bin
          # On this ephemeral runner, permit the unprivileged user namespaces
          # required by the rootless launcher. The product never changes sysctls.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Linux native sandbox acceptance
        env:
          CODELIA_APPROVAL_LINUX_LIVE: "1"
        run: |
          bun test packages/runtime/tests/command-approval-platform.test.ts
          bun test --timeout 60000 packages/runtime/tests/sandbox-git-writes.test.ts
          bun test --timeout 30000 -t 'Linux home symlinks' packages/runtime/tests/home-dot-protection.test.ts
