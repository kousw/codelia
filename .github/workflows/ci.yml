name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  js:
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release): bump workspace to v') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Build core
        run: bun run --filter @codelia/core build
      - name: Typecheck
        run: bun run typecheck
      - name: Dependency hygiene
        run: bun run check:deps
      - name: Workspace version sync check
        run: bun run check:versions
      - name: Test
        run: bun run test:js
      - name: Terminal-Bench tests
        run: bun run test:terminal-bench

  tui:
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release): bump workspace to v') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/tui
      - name: Build
        run: cargo build --locked --manifest-path crates/tui/Cargo.toml
      - name: Test
        run: cargo test --locked --manifest-path crates/tui/Cargo.toml
      - name: Test light color scheme
        run: CODELIA_TUI_COLOR_SCHEME=light cargo test --locked --manifest-path crates/tui/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Native scrollback and verifier regression tests
        env:
          CODELIA_TUI_EMULATOR_DIR: ${{ runner.temp }}/codelia-tui-emulator
          CODELIA_TUI_CAPTURE_PATH: ${{ runner.temp }}/codelia-tui-capture.json
        run: |
          npm install --prefix "$CODELIA_TUI_EMULATOR_DIR" --ignore-scripts --no-audit --no-fund --package-lock=false @xterm/headless@6.0.0
          cargo test --locked --manifest-path crates/tui/Cargo.toml inline_native_scrollback_ansi_capture
          node --test scripts/check-tui-scrollback.test.mjs
