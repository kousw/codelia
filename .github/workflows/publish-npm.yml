name: Publish npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (vX.Y.Z)"
        required: true
        type: string
      dist_tag:
        description: "npm dist-tag"
        required: true
        default: "latest"
        type: string
      dry_run:
        description: "Run npm publish with --dry-run"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  # Releases can update the same dist-tags even when their versions differ.
  group: publish-npm
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Resolve publish parameters
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_ref: ${{ steps.resolve.outputs.release_ref }}
      version: ${{ steps.resolve.outputs.version }}
      dist_tag: ${{ steps.resolve.outputs.dist_tag }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - name: Resolve inputs/tag defaults
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_DIST_TAG: ${{ inputs.dist_tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${EVENT_NAME}" = "push" ]; then
            release_tag="${PUSHED_TAG}"
            dist_tag="latest"
            dry_run="false"
          else
            release_tag="${INPUT_RELEASE_TAG}"
            dist_tag="${INPUT_DIST_TAG}"
            dry_run="${INPUT_DRY_RUN}"
          fi

          if ! [[ "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must match vX.Y.Z, got: ${release_tag}" >&2
            exit 1
          fi
          if [ -z "${dist_tag}" ]; then
            echo "dist_tag must not be empty" >&2
            exit 1
          fi
          if [[ "${dist_tag}" == codelia-staging-* || "${dist_tag}" == *$'\n'* || "${dist_tag}" == *$'\r'* ]]; then
            echo "Invalid dist_tag. The codelia-staging- prefix is reserved." >&2
            exit 1
          fi
          if [ "${dry_run}" != "true" ] && [ "${dry_run}" != "false" ]; then
            echo "dry_run must be true/false, got: ${dry_run}" >&2
            exit 1
          fi

          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "release_ref=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${release_tag#v}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${dist_tag}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${dry_run}" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
          PUBLISH_DIST_TAG: ${{ steps.resolve.outputs.dist_tag }}
          PUBLISH_DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
        run: |
          echo "- release_tag=${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- version=${RELEASE_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- dist_tag=${PUBLISH_DIST_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- dry_run=${PUBLISH_DRY_RUN}" >> "$GITHUB_STEP_SUMMARY"

  publish-tui:
    name: Publish TUI (${{ matrix.target }})
    runs-on: ${{ matrix.runs_on }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runs_on: macos-latest
            platform: darwin
            arch: arm64
            rust_target: aarch64-apple-darwin
            package_dir: packages/tui/darwin-arm64
            binary_name: codelia-tui
          - target: darwin-x64
            runs_on: macos-latest
            platform: darwin
            arch: x64
            rust_target: x86_64-apple-darwin
            package_dir: packages/tui/darwin-x64
            binary_name: codelia-tui
          - target: linux-arm64
            runs_on: ubuntu-22.04
            platform: linux
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            package_dir: packages/tui/linux-arm64
            binary_name: codelia-tui
          - target: linux-x64
            runs_on: ubuntu-22.04
            platform: linux
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            package_dir: packages/tui/linux-x64
            binary_name: codelia-tui
          - target: win32-x64
            runs_on: windows-latest
            platform: win32
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            package_dir: packages/tui/win32-x64
            binary_name: codelia-tui.exe
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      PUBLISH_DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
      PUBLISH_DRY_RUN: ${{ needs.prepare.outputs.dry_run }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/tui
          shared-key: publish-${{ matrix.target }}

      - name: Install Linux arm64 cross toolchain
        if: ${{ matrix.target == 'linux-arm64' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build TUI binary
        run: |
          if [ "${{ matrix.target }}" = "linux-arm64" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --locked --manifest-path crates/tui/Cargo.toml --target "${{ matrix.rust_target }}"

      - name: Check Linux GLIBC compatibility
        if: ${{ matrix.platform == 'linux' }}
        run: |
          binary_path="crates/tui/target/${{ matrix.rust_target }}/release/${{ matrix.binary_name }}"
          max_glibc="$(strings "${binary_path}" | grep -Eo 'GLIBC_[0-9]+\.[0-9]+' | sort -V | tail -n1)"
          max_allowed="GLIBC_2.35"
          if [ -n "${max_glibc}" ] && [ "$(printf '%s\n%s\n' "${max_glibc}" "${max_allowed}" | sort -V | tail -n1)" != "${max_allowed}" ]; then
            echo "Binary requires ${max_glibc}, which is newer than allowed ${max_allowed}" >&2
            exit 1
          fi
          echo "GLIBC compatibility check passed: ${max_glibc:-none-detected} (allowed <= ${max_allowed})"

      - name: Build MXC launcher
        if: ${{ matrix.target == 'darwin-arm64' || matrix.target == 'linux-x64' || matrix.target == 'linux-arm64' }}
        run: |
          if [ "${{ matrix.target }}" = "linux-arm64" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --locked --manifest-path crates/mxc-launcher/Cargo.toml --target "${{ matrix.rust_target }}"

      - name: Check Linux MXC launcher GLIBC compatibility
        if: ${{ matrix.target == 'linux-x64' || matrix.target == 'linux-arm64' }}
        run: |
          binary_path="crates/mxc-launcher/target/${{ matrix.rust_target }}/release/codelia-mxc-launcher"
          max_glibc="$(strings "${binary_path}" | grep -Eo 'GLIBC_[0-9]+\.[0-9]+' | sort -V | tail -n1)"
          max_allowed="GLIBC_2.35"
          if [ -n "${max_glibc}" ] && [ "$(printf '%s\n%s\n' "${max_glibc}" "${max_allowed}" | sort -V | tail -n1)" != "${max_allowed}" ]; then
            echo "MXC launcher requires ${max_glibc}, which is newer than allowed ${max_allowed}" >&2
            exit 1
          fi
          echo "MXC launcher GLIBC compatibility check passed: ${max_glibc:-none-detected} (allowed <= ${max_allowed})"

      - name: Stage TUI package binary
        run: |
          extra_args=()
          if [ "${{ matrix.target }}" = "darwin-arm64" ] || [ "${{ matrix.target }}" = "linux-x64" ] || [ "${{ matrix.target }}" = "linux-arm64" ]; then
            extra_args+=(--mxc-source "crates/mxc-launcher/target/${{ matrix.rust_target }}/release/codelia-mxc-launcher")
          fi
          node scripts/stage-tui-binary.mjs \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --source "crates/tui/target/${{ matrix.rust_target }}/release/${{ matrix.binary_name }}" \
            "${extra_args[@]}"

      - name: Resolve package metadata
        id: meta
        run: |
          pkg_name="$(node -p "require('./${{ matrix.package_dir }}/package.json').name")"
          pkg_version="$(node -p "require('./${{ matrix.package_dir }}/package.json').version")"
          if [ "${pkg_version}" != "${RELEASE_VERSION}" ]; then
            echo "${pkg_name} version ${pkg_version} does not match release tag ${RELEASE_TAG} (${RELEASE_VERSION})" >&2
            exit 1
          fi
          echo "name=${pkg_name}" >> "$GITHUB_OUTPUT"
          echo "version=${pkg_version}" >> "$GITHUB_OUTPUT"
          if npm view "${pkg_name}@${pkg_version}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "- ${pkg_name}@${pkg_version}: already published, skip" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate npm token
        if: ${{ env.PUBLISH_DRY_RUN != 'true' && steps.meta.outputs.already_published != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is required when dry_run=false" >&2
            exit 1
          fi

      - name: Publish TUI package
        if: ${{ steps.meta.outputs.already_published != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd "${{ matrix.package_dir }}"
          if [ "${PUBLISH_DRY_RUN}" = "true" ]; then
            npm publish --access public --dry-run --tag "${PUBLISH_DIST_TAG}"
          else
            npm publish --access public --tag "${PUBLISH_DIST_TAG}"
          fi

  publish-ts:
    name: Publish TypeScript packages
    runs-on: ubuntu-latest
    needs: [prepare, publish-tui]
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      PUBLISH_DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
      PUBLISH_DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
      CLI_STAGING_TAG: codelia-staging-${{ needs.prepare.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build JS packages
        run: bun run --filter @codelia/* build

      - name: Validate npm token
        if: ${{ env.PUBLISH_DRY_RUN != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is required when dry_run=false" >&2
            exit 1
          fi

      - name: Publish TypeScript packages in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package_dirs=(
            packages/config
            packages/logger
            packages/shared-types
            packages/protocol
            packages/core
            packages/storage
            packages/config-loader
            packages/model-metadata
            packages/runtime
            packages/cli
          )

          for dir in "${package_dirs[@]}"; do
            pkg_name="$(node -p "require('./${dir}/package.json').name")"
            pkg_version="$(node -p "require('./${dir}/package.json').version")"

            if [ "${pkg_version}" != "${RELEASE_VERSION}" ]; then
              echo "${pkg_name} version ${pkg_version} does not match release tag ${RELEASE_TAG} (${RELEASE_VERSION})" >&2
              exit 1
            fi

            if npm view "${pkg_name}@${pkg_version}" version --prefer-online >/dev/null 2>&1; then
              echo "- ${pkg_name}@${pkg_version}: already published, skip" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            package_dist_tag="${PUBLISH_DIST_TAG}"
            if [ "${pkg_name}" = "@codelia/cli" ]; then
              package_dist_tag="${CLI_STAGING_TAG}"
            fi
            echo "Publishing ${pkg_name}@${pkg_version} from ${dir} with tag ${package_dist_tag}"
            if [ "${PUBLISH_DRY_RUN}" = "true" ]; then
              (cd "${dir}" && npm publish --access public --dry-run --tag "${package_dist_tag}")
            else
              (cd "${dir}" && npm publish --access public --tag "${package_dist_tag}")
            fi
          done

  verify-install:
    name: Verify registry install (${{ matrix.os }})
    needs: [prepare, publish-ts]
    if: ${{ needs.prepare.outputs.dry_run != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: '@codelia/cli'
            binary: '@codelia/tui-linux-x64/bin/codelia-tui'
          - os: macos-latest
            package: '@codelia/runtime'
            binary: '@codelia/tui-darwin-arm64/bin/codelia-mxc-launcher'
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      VERIFY_PACKAGE: ${{ matrix.package }}
      VERIFY_BINARY: ${{ matrix.binary }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify a clean install from the public npm registry
        run: |
          smoke_root="$(mktemp -d)"
          trap 'rm -rf -- "$smoke_root"' EXIT
          # Registry metadata and tarballs can become visible at different times.
          deadline=$((SECONDS + 20 * 60))
          run_install() {
            node -e '
              const { spawnSync } = require("node:child_process");
              const [seconds, ...args] = process.argv.slice(1);
              const result = spawnSync("npm", args, {
                stdio: "inherit", timeout: Number(seconds) * 1000, killSignal: "SIGKILL",
              });
              if (result.error) console.error(result.error.message);
              process.exitCode = result.status ?? 1;
            ' "$@"
          }
          for ((attempt = 1; ; attempt++)); do
            remaining=$((deadline - SECONDS))
            if [ "${remaining}" -le 0 ]; then
              echo "Registry install failed for ${VERIFY_PACKAGE}@${RELEASE_VERSION} within 20 minutes." >&2
              exit 1
            fi
            install_dir="${smoke_root}/${attempt}"
            mkdir -p "${install_dir}"
            attempt_timeout=$((remaining < 90 ? remaining : 90))
            if run_install "${attempt_timeout}" install --registry https://registry.npmjs.org \
                --prefix "${install_dir}" --cache "${install_dir}/cache" \
                --prefer-online --fetch-retries=0 --fetch-timeout=30000 --no-audit --no-fund \
                "${VERIFY_PACKAGE}@${RELEASE_VERSION}"; then
              if [ -x "${install_dir}/node_modules/${VERIFY_BINARY}" ]; then
                break
              fi
              echo "Required optional binary ${VERIFY_BINARY} is missing." >&2
            fi
            rm -rf -- "${install_dir}"
            remaining=$((deadline - SECONDS))
            echo "${VERIFY_PACKAGE}@${RELEASE_VERSION} is not installable yet (attempt ${attempt})."
            if [ "${remaining}" -gt 0 ]; then sleep "$((remaining < 20 ? remaining : 20))"; fi
          done

          if [ "${VERIFY_PACKAGE}" = '@codelia/cli' ]; then
            if [ ! -x "${install_dir}/node_modules/@codelia/tui-linux-x64/bin/codelia-mxc-launcher" ]; then
              echo "Required Linux MXC launcher binary is missing." >&2
              exit 1
            fi
            installed_version="$("${install_dir}/node_modules/.bin/codelia" --version)"
            if [ "${installed_version}" != "${RELEASE_VERSION}" ]; then
              echo "Expected CLI version ${RELEASE_VERSION}, got ${installed_version}" >&2
              exit 1
            fi
          else
            node --input-type=module - "${install_dir}" "${smoke_root}" <<'NODE'
          import { checkInstalledMxc } from './scripts/release-smoke-shell.mjs';
          const [installDir, smokeRoot] = process.argv.slice(2);
          await checkInstalledMxc(installDir, smokeRoot);
          NODE
          fi
          echo "Registry install passed for ${VERIFY_PACKAGE}@${RELEASE_VERSION}"

  promote-cli:
    name: Promote verified CLI
    runs-on: ubuntu-latest
    needs: [prepare, verify-install]
    if: ${{ needs.prepare.outputs.dry_run != 'true' }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      PUBLISH_DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
      CLI_STAGING_TAG: codelia-staging-${{ needs.prepare.outputs.release_tag }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Promote verified CLI to the requested dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          dist_tags="$(npm view @codelia/cli dist-tags --json --prefer-online)"
          target_version="$(jq -r --arg tag "${PUBLISH_DIST_TAG}" '.[$tag] // empty' <<< "${dist_tags}")"
          if [ "${target_version}" != "${RELEASE_VERSION}" ]; then
            if [ -n "${target_version}" ] &&
                [ "$(printf '%s\n%s\n' "${target_version}" "${RELEASE_VERSION}" | sort -V | tail -n1)" = "${target_version}" ]; then
              echo "Keeping ${PUBLISH_DIST_TAG} on newer CLI version ${target_version}."
            else
              npm dist-tag add "@codelia/cli@${RELEASE_VERSION}" "${PUBLISH_DIST_TAG}"
            fi
          fi
          staged_version="$(jq -r --arg tag "${CLI_STAGING_TAG}" '.[$tag] // empty' <<< "${dist_tags}")"
          if [ "${staged_version}" = "${RELEASE_VERSION}" ]; then
            if ! npm dist-tag rm @codelia/cli "${CLI_STAGING_TAG}"; then
              echo "::warning::Could not remove the staging dist-tag ${CLI_STAGING_TAG} after promotion. Check the npm token's dist-tag permissions."
            fi
          fi
