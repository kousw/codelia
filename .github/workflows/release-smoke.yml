name: MXC native smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-sdk:
    runs-on: windows-11-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - name: Install the qualification SDK outside the workspace
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP "codelia-mxc-qualification"
          npm install --prefix $prefix --save-exact --no-audit --no-fund @microsoft/mxc-sdk@1.1.0
      - name: Build and verify a minimal native ARM64 console fixture
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $vars = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          $file = Join-Path $env:RUNNER_TEMP 'mxc-ci-exit.c'
          $exe = Join-Path $env:RUNNER_TEMP 'mxc-ci-exit.exe'
          '__declspec(dllimport) __declspec(noreturn) void __stdcall ExitProcess(unsigned); void Entry(void) { ExitProcess(42); }' | Set-Content -Encoding ascii $file
          $cmd = 'call "' + $vars + '" arm64 && cl /nologo /O2 "' + $file + '" /Fe:"' + $exe + '" /link /entry:Entry /subsystem:console /nodefaultlib kernel32.lib'
          & cmd.exe /d /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "Build failed: $LASTEXITCODE" }
          & $exe
          if ($LASTEXITCODE -ne 42) { throw "Host positive control failed" }
          "CODELIA_CI_EXIT_FIXTURE=$exe" >> $env:GITHUB_ENV
          exit 0
      - name: Measure this runner
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP "codelia-mxc-qualification"
          node scripts/qualify-windows-mxc.mjs $prefix | Set-Content -Encoding utf8 windows-mxc-observation.json
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows11-arm-mxc-observation
          path: windows-mxc-observation.json
          if-no-files-found: ignore

  linux-sdk:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - name: Install SDK and bubblewrap
        run: |
          if ! command -v bwrap; then
            sudo apt-get update -q
            sudo apt-get install -y bubblewrap
          fi
          npm install --prefix "$RUNNER_TEMP/codelia-mxc" --no-audit --no-fund @microsoft/mxc-sdk@1.1.0
      - name: Observe native support and execute a fixed command
        run: node scripts/smoke-mxc-linux-ci.mjs "$RUNNER_TEMP/codelia-mxc" > linux-mxc-observation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-mxc-observation
          path: linux-mxc-observation.json

  native-helper:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build production helper and run crate tests
        run: |
          cargo test --locked --manifest-path crates/mxc-launcher/Cargo.toml
          cargo build --locked --manifest-path crates/mxc-launcher/Cargo.toml
      - name: Verify native probe or explicit unavailable
        shell: bash
        run: |
          exe=crates/mxc-launcher/target/debug/codelia-mxc-launcher
          if [[ "$RUNNER_OS" = Windows ]]; then exe="${exe}.exe"; fi
          if "$exe" --probe; then code=0; else code=$?; fi
          echo "Host $RUNNER_OS / $RUNNER_ARCH, product helper probe exit code: $code"
          if [[ "$RUNNER_OS" = macOS ]]; then test "$code" = 0; else test "$code" = 125; fi
