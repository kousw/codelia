<svg xmlns="http://www.w3.org/2000/svg" role="img" lang="ja" aria-labelledby="shell-title shell-desc" viewBox="0 0 820 548" width="820" height="548"><title id="shell-title">ループは一つの起動として承認する</title><desc id="shell-desc">状態変更、束縛、実行操作を解析し、二つの操作がともに許可されれば確認なしで原文を一度実行。</desc><defs>
<marker id="shell-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#203F51"/></marker>
<marker id="shell-a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#176551"/></marker>
<marker id="shell-a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#235F8B"/></marker>
<marker id="shell-a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#983F3D"/></marker>
<marker id="shell-a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#845418"/></marker>
</defs>
<g font-family="Hiragino Sans, Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif">
<rect x="0" y="0" width="820" height="548" rx="0" fill="#FBFCFA" stroke="none" stroke-width="1.5"/>
<text x="26" y="39" text-anchor="start" font-size="25" fill="#203F51" font-weight="650">ループは一つの起動として承認する</text>
<rect x="27" y="64" width="765" height="58" rx="9" fill="#E9F1F4" stroke="none" stroke-width="1.5"/>
<text x="42" y="100" text-anchor="start" font-size="21" fill="#203F51" font-weight="600">set -e; for f in a.txt b.txt; do wc -l &quot;$f&quot;; done</text>
<polyline points="143,123 143,160" fill="none" stroke="#203F51" stroke-linejoin="round" stroke-width="2" marker-end="url(#shell-a0)"/>
<rect x="28" y="163" width="248" height="64" rx="9" fill="#F0F4F5" stroke="none" stroke-width="1.5"/>
<text x="42" y="190" text-anchor="start" font-size="18" fill="#203F51" font-weight="650">シェル状態</text>
<text x="42" y="215" text-anchor="start" font-size="15" fill="#465F6D" font-weight="400">set -e を後続へ適用</text>
<polyline points="400,123 400,160" fill="none" stroke="#203F51" stroke-linejoin="round" stroke-width="2" marker-end="url(#shell-a0)"/>
<rect x="285" y="163" width="248" height="64" rx="9" fill="#F0F4F5" stroke="none" stroke-width="1.5"/>
<text x="299" y="190" text-anchor="start" font-size="18" fill="#203F51" font-weight="650">ループの束縛</text>
<text x="299" y="215" text-anchor="start" font-size="15" fill="#465F6D" font-weight="400">f は a.txt または b.txt</text>
<polyline points="657,123 657,160" fill="none" stroke="#203F51" stroke-linejoin="round" stroke-width="2" marker-end="url(#shell-a0)"/>
<rect x="542" y="163" width="248" height="64" rx="9" fill="#F0F4F5" stroke="none" stroke-width="1.5"/>
<text x="556" y="190" text-anchor="start" font-size="18" fill="#203F51" font-weight="650">本体の操作</text>
<text x="556" y="215" text-anchor="start" font-size="15" fill="#465F6D" font-weight="400">wc -l に引数を1個渡す</text>
<polyline points="405,228 405,254" fill="none" stroke="#203F51" stroke-linejoin="round" stroke-width="2" marker-end="url(#shell-a0)"/>
<polyline points="665,228 665,244 611,244 611,254" fill="none" stroke="#203F51" stroke-linejoin="round" stroke-width="2" marker-end="url(#shell-a0)"/>
<rect x="51" y="257" width="717" height="78" rx="9" fill="#E9F5EE" stroke="none" stroke-width="1.5"/>
<text x="68" y="287" text-anchor="start" font-size="18" fill="#176551" font-weight="650">既存ルールに照合する対象</text>
<text x="68" y="316" text-anchor="start" font-size="17" fill="#203F51" font-weight="400">wc -l a.txt　／　wc -l b.txt　　同じ調査用プロファイルで判定</text>
<polyline points="148,335 148,377" fill="none" stroke="#176551" stroke-linejoin="round" stroke-width="2" marker-end="url(#shell-a1)"/>
<rect x="27" y="381" width="249" height="70" rx="9" fill="#E9F5EE" stroke="none" stroke-width="1.5"/>
<text x="41" y="408" text-anchor="start" font-size="18" fill="#176551" font-weight="650">どちらも許可済み</text>
<text x="41" y="433" text-anchor="start" font-size="15" fill="#465F6D" font-weight="400">原文を1回実行</text>
<polyline points="407,335 407,377" fill="none" stroke="#845418" stroke-linejoin="round" stroke-width="2" marker-end="url(#shell-a4)"/>
<rect x="284" y="381" width="249" height="70" rx="9" fill="#FCF3E4" stroke="none" stroke-width="1.5"/>
<text x="298" y="408" text-anchor="start" font-size="18" fill="#845418" font-weight="650">不足する許可がある</text>
<text x="298" y="433" text-anchor="start" font-size="15" fill="#465F6D" font-weight="400">全体を1件として判断</text>
<polyline points="665,335 665,377" fill="none" stroke="#983F3D" stroke-linejoin="round" stroke-width="2" marker-end="url(#shell-a3)"/>
<rect x="541" y="381" width="249" height="70" rx="9" fill="#FCEFEB" stroke="none" stroke-width="1.5"/>
<text x="555" y="408" text-anchor="start" font-size="18" fill="#983F3D" font-weight="650">一方が明示 deny</text>
<text x="555" y="433" text-anchor="start" font-size="15" fill="#465F6D" font-weight="400">どの段も起動しない</text>
<text x="31" y="492" text-anchor="start" font-size="16" fill="#203F51" font-weight="550">for / do / done の確認は0件。ループ・本体・キーワードから作る保存ルールも0件。</text>
</g></svg>
