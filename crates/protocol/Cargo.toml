[package]
name = "codelia-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.93.1"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# Preserve safe integers written as decimals or exponents when parsing JSON.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
