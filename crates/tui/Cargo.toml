[package]
name = "codelia-tui"
version = "0.1.82"
edition = "2021"

[[bin]]
name = "codelia-tui"
path = "src/main.rs"

[features]
# Kept as the opt-in switch for the standalone lab; production preview is built in.
image-preview = []

[[example]]
name = "codelia-image-preview"
path = "examples/image-preview/main.rs"
required-features = ["image-preview"]
test = true

[dependencies]
crossterm = "0.29"
# CSI S can drop native history (e.g. xterm.js). Keep LF-based insertion.
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
# Match Ratatui's cell-width semantics for wrapping and history serialization.
unicode-width = "0.2.2"
unicode-segmentation = "1.12"
arboard = "3.6.1"
base64 = "0.22"
png = "0.18"
similar = "2.7"
syntect = "5.2"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ratatui-image = { version = "=11.0.8", default-features = false, features = ["crossterm"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
