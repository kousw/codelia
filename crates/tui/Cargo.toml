[package]
name = "codelia-tui"
version = "0.1.80"
edition = "2021"

[[bin]]
name = "codelia-tui"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
# CSI S can drop native history (e.g. xterm.js). Keep LF-based insertion.
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
# Match Ratatui's cell-width semantics for wrapping and history serialization.
unicode-width = "0.2.2"
unicode-segmentation = "1.12"
arboard = "3.6.1"
base64 = "0.22"
png = "0.18"
similar = "2.7"
syntect = "5.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
